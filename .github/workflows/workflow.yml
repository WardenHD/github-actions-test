name: Run tests

on:
    push:
        branches: [dev]

jobs:
    test-cxx11:
        name: Test C++11
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup python
              run: actions/setup-python@v6

            - name: Install SCons
              run: |
                python -m pip install --upgrade pip
                python -m pip install scons
            
            - name: Run test
              run: scons test --cppstd=11
